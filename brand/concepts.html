<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BizUp Logo Concepts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;800;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #141416; font-family: 'Kanit', sans-serif; color: #D7E2EA; padding: 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
      .card { background: #0C0C0C; border-radius: 24px; padding: 26px 24px 20px; display: flex; flex-direction: column; gap: 18px; border: 1px solid rgba(215,226,234,0.08); }
      .lockup { display: flex; align-items: center; gap: 16px; min-height: 104px; }
      .lockup svg { width: 96px; height: 96px; flex: none; overflow: visible; }
      .word { line-height: 0.9; }
      .word b { display: block; font-weight: 800; font-size: 46px; letter-spacing: -0.01em;
        background: linear-gradient(180deg, #F1F5F8, #9AA6B0); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      .word small { display: block; font-weight: 500; font-size: 11.5px; letter-spacing: 0.42em; margin-top: 8px; color: #D7E2EA; opacity: 0.8; }
      .label { display: flex; align-items: baseline; gap: 10px; }
      .label span { font-weight: 900; font-size: 22px; color: #5C8CFF; }
      .label p { font-size: 14px; opacity: 0.75; line-height: 1.4; }
      .label strong { color: #fff; font-weight: 500; }
      .icons { display: flex; align-items: center; gap: 14px; }
      .icons svg { overflow: visible; }
      .light { background: #fff; border-radius: 14px; padding: 8px; display: inline-flex; }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <linearGradient id="bz" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="100" y2="0">
          <stop offset="0" stop-color="#45CCFF" />
          <stop offset="0.5" stop-color="#5C8CFF" />
          <stop offset="1" stop-color="#9B5CF6" />
        </linearGradient>
        <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
          <stop offset="0" stop-color="#F1F5F8" />
          <stop offset="1" stop-color="#9AA6B0" />
        </linearGradient>
      </defs>
    </svg>

    <div class="grid" id="grid"></div>

    <script>
      /* ---------- the marks (100 x 100 grid) ---------- */

      const marks = {};

      // A — B whose spine is an up arrow
      marks.A = `<g transform="translate(6 0)" fill="none" stroke="url(#bz)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 92 V12 M18 24 L30 12 L42 24" />
        <path d="M30 38 H54 a12 12 0 0 1 0 24 H30" />
        <path d="M30 62 H58 a15 15 0 0 1 0 30 H30" />
      </g>`;

      // B — code brackets with an up arrow inside: </> meets growth
      marks.B = `<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
        <path d="M30 28 L10 50 L30 72" stroke="url(#silver)" />
        <path d="M70 28 L90 50 L70 72" stroke="url(#silver)" />
        <path d="M50 80 V22 M36 36 L50 22 L64 36" stroke="url(#bz)" />
      </g>`;

      // C — a gear with an arrow bursting out of it: automation that grows
      marks.C = (() => {
        const cx = 44, cy = 56, teeth = 9, rRoot = 26, rTip = 34;
        let d = '';
        for (let i = 0; i < teeth; i++) {
          const a0 = (i / teeth) * Math.PI * 2 - Math.PI / 2;
          const step = (Math.PI * 2) / teeth;
          const pts = [
            [a0 - step * 0.5, rRoot], [a0 - step * 0.2, rRoot], [a0 - step * 0.14, rTip],
            [a0 + step * 0.14, rTip], [a0 + step * 0.2, rRoot],
          ];
          pts.forEach(([a, r], k) => {
            d += `${i === 0 && k === 0 ? 'M' : 'L'}${(cx + Math.cos(a) * r).toFixed(2)} ${(cy + Math.sin(a) * r).toFixed(2)} `;
          });
        }
        d += 'Z';
        const hole = `M${cx + 12} ${cy} a12 12 0 1 0 -24 0 a12 12 0 1 0 24 0 Z`;
        return `<path d="${d} ${hole}" fill="url(#silver)" fill-rule="evenodd" />
          <g fill="none" stroke="#0C0C0C" stroke-width="16" stroke-linecap="round"><path d="M${cx} ${cy} L86 14" /></g>
          <g fill="none" stroke="url(#bz)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
            <path d="M${cx} ${cy} L86 14" /><path d="M64 14 H86 V36" />
          </g>`;
      })();

      // D — a pixel "b" whose top pixel has become an arrow
      marks.D = (() => {
        const u = 17, g = 3, x0 = 22, y0 = 4;
        const cells = [[0, 1], [0, 2], [0, 3], [0, 4], [1, 2], [2, 2], [2, 3], [1, 4], [2, 4]];
        const colors = ['#45CCFF', '#4FB2FF', '#5C9BFF', '#5C8CFF', '#6E7CFA', '#7F6CF7', '#8C5CF5', '#9B5CF6', '#A85CF0'];
        const rects = cells.map(([c, r], i) =>
          `<rect x="${x0 + c * (u + g)}" y="${y0 + r * (u + g)}" width="${u}" height="${u}" rx="4" fill="${colors[(4 - r) * 2 % colors.length] || colors[i]}" />`
        ).join('');
        const ax = x0 + u / 2;
        const arrow = `<path d="M${x0 - 2} ${y0 + u} L${ax} ${y0 - 4} L${x0 + u + 2} ${y0 + u} Z" fill="#45CCFF" stroke="#45CCFF" stroke-width="3" stroke-linejoin="round" />`;
        return rects + arrow;
      })();

      // E — isometric blocks stacking upward: building your business, block by block
      marks.E = (() => {
        const cube = (x, y, s, top, left, right) => {
          const h = s * 0.5;
          return `<path d="M${x} ${y} l${s} ${h} l${-s} ${h} l${-s} ${-h} Z" fill="${top}" />
            <path d="M${x - s} ${y + h} l${s} ${h} v${s * 1.1} l${-s} ${-h} Z" fill="${left}" />
            <path d="M${x} ${y + 2 * h} l${s} ${-h} v${s * 1.1} l${-s} ${h} Z" fill="${right}" />`;
        };
        return cube(30, 56, 20, '#F1F5F8', '#9AA6B0', '#6F7982')
          + cube(54, 42, 20, '#9fd9ff', '#4FB2FF', '#3a7fd6')
          + cube(78, 14, 20, '#d4c2ff', '#8C5CF5', '#6a3fd0');
      })();

      // F — "bu" in one line, the u's last stroke shooting up as an arrow
      marks.F = `<g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
        <path d="M12 10 V70 a17 17 0 1 0 34 0 a17 17 0 1 0 -34 0" stroke="url(#silver)" />
        <path d="M58 52 V70 a12 12 0 0 0 24 0 V14 M70 26 L82 14 L94 26" stroke="url(#bz)" />
      </g>`;

      /* ---------- round 2: symbols, no letters ---------- */

      // G — a rocket launching up and to the right
      marks.G = `<g transform="rotate(40 50 50)">
        <circle cx="50" cy="90" r="3" fill="#45CCFF" opacity="0.5" /><circle cx="50" cy="98" r="2" fill="#45CCFF" opacity="0.3" />
        <path d="M44 66 Q50 88 56 66 Z" fill="#45CCFF" />
        <path d="M38 50 L26 68 L39 65 Z M62 50 L74 68 L61 65 Z" fill="url(#silver)" />
        <path d="M50 8 C63 21 66 42 62 66 H38 C34 42 37 21 50 8 Z" fill="url(#bz)" />
        <circle cx="50" cy="36" r="8" fill="#0C0C0C" stroke="url(#silver)" stroke-width="3" />
      </g>`;

      // H — a sun rising over lines of code
      marks.H = `<path d="M20 60 A30 30 0 0 1 80 60 Z" fill="url(#bz)" />
        <g stroke="url(#bz)" stroke-width="4" stroke-linecap="round" opacity="0.8">
          <path d="M50 14 V22 M24 24 L29 30 M76 24 L71 30 M10 44 L18 46 M90 44 L82 46" />
        </g>
        <g stroke="url(#silver)" stroke-width="7" stroke-linecap="round">
          <path d="M10 70 H90" /><path d="M22 81 H56 M66 81 H78" /><path d="M34 92 H66" />
        </g>`;

      // I — a summit with a flag: reaching the top
      marks.I = `<path d="M6 88 L40 30 L55 54 L67 38 L94 88 Z" fill="url(#silver)" />
        <path d="M40 30 L49 45 L43 42 L37 48 L32 43 Z" fill="#F1F5F8" />
        <path d="M40 30 V8" stroke="#D7E2EA" stroke-width="3" stroke-linecap="round" />
        <path d="M41 8 L62 14 L41 21 Z" fill="url(#bz)" />
        <path d="M14 88 Q30 72 36 62" stroke="url(#bz)" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="round" fill="none" />`;

      // J — a sprout growing out of a circuit board
      marks.J = `<g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M50 84 V36" stroke="url(#bz)" stroke-width="7" />
          <path d="M50 84 H28 V94 M50 84 H72 V94" stroke="url(#silver)" stroke-width="5" />
        </g>
        <circle cx="28" cy="94" r="5" fill="#9AA6B0" /><circle cx="72" cy="94" r="5" fill="#9AA6B0" /><circle cx="50" cy="84" r="5" fill="#D7E2EA" />
        <path d="M50 60 C38 60 22 54 18 36 C34 34 48 42 50 60 Z" fill="url(#bz)" opacity="0.8" />
        <path d="M50 44 C58 26 74 16 90 16 C88 36 72 46 50 44 Z" fill="url(#bz)" />`;

      // K — a paper plane taking off with a dotted flight path
      marks.K = `<path d="M6 94 Q16 72 34 64" stroke="url(#silver)" stroke-width="3.5" stroke-dasharray="2 6" stroke-linecap="round" fill="none" />
        <path d="M8 50 L94 10 L64 88 L48 60 Z" fill="url(#bz)" />
        <path d="M48 60 L94 10 L54 72 Z" fill="#0C0C0C" opacity="0.35" />
        <path d="M48 60 L94 10" stroke="#F1F5F8" stroke-width="2" opacity="0.7" />`;

      // L — an infinity loop (automation that never stops) with an arrow on it
      marks.L = `<path d="M50 50 C58 36 88 32 88 50 C88 68 58 64 50 50 C42 36 12 32 12 50 C12 68 42 64 50 50"
          fill="none" stroke="url(#bz)" stroke-width="10" stroke-linecap="round" />
        <path d="M74 30 L86 38 L73 45" fill="none" stroke="#F1F5F8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />`;

      // M — a chat bubble with growth inside: talk to us, grow
      marks.M = `<path d="M22 12 H78 a14 14 0 0 1 14 14 V60 a14 14 0 0 1 -14 14 H44 L24 90 V74 H22 a14 14 0 0 1 -14 -14 V26 a14 14 0 0 1 14 -14 Z" fill="url(#silver)" />
        <g fill="url(#bz)"><rect x="24" y="48" width="12" height="16" rx="3" /><rect x="42" y="38" width="12" height="26" rx="3" /><rect x="60" y="26" width="12" height="38" rx="3" /></g>`;

      // N — an arrow breaking out of a browser window: go beyond
      marks.N = `<rect x="8" y="26" width="64" height="62" rx="12" fill="none" stroke="url(#silver)" stroke-width="7" />
        <path d="M8 42 H72" stroke="url(#silver)" stroke-width="5" />
        <circle cx="19" cy="34" r="2.6" fill="#9AA6B0" /><circle cx="28" cy="34" r="2.6" fill="#9AA6B0" />
        <path d="M34 72 L88 18" stroke="#0C0C0C" stroke-width="20" stroke-linecap="round" />
        <g fill="none" stroke="url(#bz)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M34 72 L88 18" /><path d="M62 16 H90 V44" /></g>`;

      // O — a lightning bolt: fast, energetic, powered up
      marks.O = `<path d="M60 4 L20 56 H46 L36 96 L82 38 H56 Z" fill="url(#bz)" stroke="url(#bz)" stroke-width="3" stroke-linejoin="round" />
        <path d="M60 4 L46 30" stroke="#F1F5F8" stroke-width="3" stroke-linecap="round" opacity="0.6" />`;

      /* ---------- render ---------- */

      const rounds = [
        ['Round 2 — symbols', [
          ['G', 'Rocket', 'A <strong>rocket</strong> launching up — we launch your business online.'],
          ['H', 'Sunrise code', 'A <strong>sun rising over lines of code</strong> — a fresh start, powered by software.'],
          ['I', 'Summit', 'A <strong>mountain peak with a flag</strong> — helping you reach the top.'],
          ['J', 'Circuit sprout', 'A <strong>plant growing from a circuit</strong> — tech that makes your business grow.'],
          ['K', 'Paper plane', 'A <strong>paper plane taking off</strong> — ideas that fly, direct communication.'],
          ['L', 'Infinity loop', 'An <strong>endless loop</strong> — automation that runs itself, support that never stops.'],
          ['M', 'Talk & grow', 'A <strong>chat bubble with rising bars</strong> — talk to us directly, watch the numbers go up.'],
          ['N', 'Break out', 'An arrow <strong>breaking out of a browser window</strong> — going beyond a basic website.'],
          ['O', 'Power bolt', 'A <strong>lightning bolt</strong> — fast, energetic, your business powered up.'],
        ]],
        ['Round 1 — letters', [
          ['A', 'Arrow B', 'The spine of the <strong>B</strong> is an up arrow — business, going up.'],
          ['B', 'Code up', 'Code brackets <strong>&lt; &gt;</strong> with growth in the middle — software that moves you up.'],
          ['C', 'Gear burst', 'An arrow breaking out of a <strong>gear</strong> — automation that drives growth.'],
          ['D', 'Pixel b', 'A <strong>b</strong> built from pixels, its top pixel turned into an arrow — digital, playful.'],
          ['E', 'Block stack', '<strong>3D blocks</strong> climbing upward — building your business, block by block.'],
          ['F', 'bu ligature', 'The letters <strong>b u</strong> drawn in one flow, the u shooting up as an arrow.'],
        ]],
      ];

      const svg = (inner, size) =>
        `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">${inner}</svg>`;

      document.getElementById('grid').outerHTML = rounds.map(([title, concepts]) => `
        <h2 style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:10px 4px 12px">${title}</h2>
        <div class="grid" style="margin-bottom:28px">${concepts.map(([key, name, desc]) => `
          <div class="card">
            <div class="label"><span>${key}</span><p><strong>${name}.</strong> ${desc}</p></div>
            <div class="lockup">${svg(marks[key], 96)}<div class="word"><b>BizUp</b><small>TECHNOLOGIES</small></div></div>
            <div class="icons">${svg(marks[key], 48)}${svg(marks[key], 32)}${svg(marks[key], 16)}<span class="light">${svg(marks[key], 40)}</span></div>
          </div>`).join('')}
        </div>`).join('');
    </script>
  </body>
</html>
